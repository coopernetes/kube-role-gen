name: build/test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, test & install
        run: |
          go mod download
          make test
          make install
          gopath_bin="$(go env GOPATH)/bin"
          echo "$gopath_bin" >> "$GITHUB_PATH"
          export PATH="$gopath_bin:$PATH"
          kube-role-gen -help
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # ratchet:helm/kind-action@v1.14.0
        with:
          # kind binary and node image must be a matched pair: the v1.37.0 node
          # image ships with kind v0.33.0 (older kind emits a kubeadm v1beta3
          # config the newer node rejects).
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Run Kubernetes e2e tests
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          CONFTEST_VERSION=0.69.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          make e2e
